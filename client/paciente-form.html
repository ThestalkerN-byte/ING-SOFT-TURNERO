<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Paciente</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <h2 id="form-title">Registrar Paciente</h2>

    <form id="paciente-form">
        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" required>

        <label for="age">Age:</label>
        <input type="number" id="age" required>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" required>

        <label for="obraSocial">Obra Social:</label>
        <input type="text" id="obraSocial" required>

        <label for="telefono">Phone:</label>
        <input type="text" id="telefono" required>

        <div class="form-buttons">
            <button type="submit" id="btn-guardar">Guardar</button>
            <button type="button" id="btn-cancelar">Cancelar</button>
        </div>
    </form>

    <!-- Vinculamos el archivo JS -->
    <script src="../js/paciente-form.js"></script>

</body>
</html>
