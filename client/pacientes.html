<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes | Consultorio Dr. Amado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Consultorio Dr. Amado</div>
        <div class="nav-links">
            <a href="agenda.html">Agenda</a>
            <a href="pacientes.html" class="active">Pacientes</a>
            <a href="#" id="cerrar-sesion">Cerrar Sesión</a>
        </div>
    </nav>

    <main class="main-content">
        
        <div class="pacientes-header">
            <h2>Gestión de Pacientes</h2>
            <button id="btn-nuevo-paciente" class="btn-primario">
                + Registrar Nuevo Paciente
            </button>
        </div>

        <input type="text" id="paciente-search" class="paciente-search" 
               placeholder="Buscar paciente por Nombre">

        <table class="pacientes-table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Obra Social</th>
                    <th class="acciones-col">Acciones</th>
                </tr>
            </thead>
            <tbody id="pacientes-tbody">
                </tbody>
        </table>

    </main>

    <div id="modal-paciente" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modal-paciente-close">&times;</span>
            <h2 id="modal-title">Registrar Paciente</h2>
            
            <form id="form-paciente">
                <div class="form-paciente"> 
                    <div class="input-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')" required>
                    </div>

                    <div class="input-group">
                        <label for="surname">Apellido:</label>
                        <input type="text" id="surname" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')" required>
                    </div>

                    <div class="input-group">
                        <label for="age">Edad:</label>
                        <input type="number" id="age" min="0" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>

                    <div class="input-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" maxlength="8"  oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>

                    <div class="input-group">
                        <label for="obraSocial">Obra Social:</label>
                        <input type="text" id="obraSocial" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="phone">Teléfono:</label>
                        <input type="tel" id="phone" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="submit" id="btn-guardar" class="action-btn edit-btn">Guardar</button>
                    <button type="button" id="btn-cancelar-form" class="action-btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-delete-paciente" class="modal">
        <div class="modal-content" style="text-align: center;">
            <span class="close-btn" id="modal-delete-close">&times;</span>
            <h2>Confirmar Eliminación</h2>
            <p>¿Está seguro de que desea eliminar este paciente?</p>
            <p id="delete-paciente-info" style="font-weight: bold;"></p>
            
            <div class="modal-actions">
                <button id="btn-cancelar-delete" class="action-btn btn-secondary">Cancelar</button>
                <button id="btn-confirmar-delete" class="action-btn btn-danger">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="modal-success-paciente" class="modal">
        <div class="modal-content" style="text-align: center;">
            <span class="close-btn" id="modal-success-close">&times;</span>
            <h2>¡Éxito!</h2>
            <p>Paciente guardado correctamente.</p>
            <div class="modal-actions">
                <button id="btn-success-ok" class="action-btn edit-btn">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="js/pacientes.js" defer></script>
</body>
</html>
