<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | Consultorio Dr. Amado</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Consultorio Dr. Amado</div>
        <div class="nav-links">
            <a href="agenda.html" class="active">Agenda</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="#" id="cerrar-sesion">Cerrar Sesión</a>
        </div>
    </nav>

    <main class="main-content">
        
        <div class="agenda-controls">
            <button id="btn-prev-week">&lt; Semana Anterior</button>
            <h3 id="semana-titulo">Cargando...</h3>
            <button id="btn-next-week">Siguiente Semana &gt;</button>
        </div>

        <table class="agenda-table">
            <thead>
                <tr>
                    <th class="hora-col">Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="agenda-body">
                </tbody>
        </table>

    </main>

    <div id="modal-agendar" class="modal">
        </div>

    <div id="modal-delete-turno" class="modal">
        </div>


    <script src="../js/agenda.js"></script>
</body>
</html>
